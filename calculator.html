<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="script.js"></script>
  </head>

  <body>
    <table>
      <thead>
        <tr>
          <th colspan="4">
            <div id="result" class="result">0</div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><button id="btnC" class="secondary">C</button></td>
          <td><button id="btnInv" class="secondary">+/-</button></td>
          <td><button id="btn_operator_%" class="secondary">%</button></td>
          <td><button id="btn_operator_/" class="secondary">/</button></td>
        </tr>
        <tr>
          <td><button id="btn_digit_7" class="primary">7</button></td>
          <td><button id="btn_digit_8" class="primary">8</button></td>
          <td><button id="btn_digit_9" class="primary">9</button></td>
          <td><button id="btn_operator_*" class="secondary">*</button></td>
        </tr>
        <tr>
          <td><button id="btn_digit_4" class="primary">4</button></td>
          <td><button id="btn_digit_5" class="primary">5</button></td>
          <td><button id="btn_digit_6" class="primary">6</button></td>
          <td><button id="btn_operator_-" class="secondary">-</button></td>
        </tr>
        <tr>
          <td><button id="btn_digit_1" class="primary">1</button></td>
          <td><button id="btn_digit_2" class="primary">2</button></td>
          <td><button id="btn_digit_3" class="primary">3</button></td>
          <td><button id="btn_operator_+" class="secondary">+</button></td>
        </tr>
        <tr>
          <td><button id="btn_digit_0" class="primary">0</button></td>
          <td><button id="btnDot" class="primary">.</button></td>
          <td colspan="2">
            <button id="btnCalc" class="secondary">=</button>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
