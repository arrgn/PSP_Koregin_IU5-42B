<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Внимание :: Фонд сохранения исторического наследия</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.png" type="img/png" />
    <script type="text/javascript" src="calculator.js"></script>
  </head>
  <body>
    <header>
      <div class="header_wrap fixed">
        <div class="header_info">
          <div class="container">
            <div class="flex header_info-content">
              <ul class="header_info-menu">
                <li>
                  <a href="/index.html"> О нас </a>
                </li>
                <li>
                  <a href="/index.html"> Экспертный совет </a>
                </li>
                <li>
                  <a href="/index.html"> Финансовый отчёт </a>
                </li>
                <li>
                  <a href="/index.html"> Капремонт </a>
                </li>
                <li>
                  <a href="/calculator.html"> Калькулятор </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="header_main">
          <div class="container">
            <div class="flex header_main-content">
              <a class="header_logo" href="/">
                <img src="./logo2.svg" alt="logo" />
              </a>
              <ul class="header_menu">
                <li>
                  <a href="/index.html">Сохранили</a>
                </li>
                <li>
                  <a href="/index.html">Восстанавливаем</a>
                </li>
                <li>
                  <a href="/index.html">Сбор денег</a>
                </li>
              </ul>
              <div class="flex header_btn">
                <a class="btn btn-main btn-small" href="/">Поддержать нас</a>
                <a class="btn btn-secondary btn-small" href="/"> Отправить заявку </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <table class="calculator">
      <thead>
        <tr>
          <th colspan="5">
            <div id="result" class="calc-result calc-result-light">0</div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <button id="btnTheme" class="btn calc-secondary-light">☀</button>
          </td>
          <td><button id="btnC" class="btn calc-secondary-light">C</button></td>
          <td>
            <button id="btnInv" class="btn calc-secondary-light">+/-</button>
          </td>
          <td>
            <button id="btn_operator_%" class="btn calc-secondary-light">%</button>
          </td>
          <td>
            <button id="btn_operator_/" class="btn calc-secondary-light">/</button>
          </td>
        </tr>
        <tr>
          <td>
            <button id="btnSqrt" class="btn calc-secondary-light">√</button>
          </td>
          <td>
            <button id="btn_digit_7" class="btn calc-primary-light">7</button>
          </td>
          <td>
            <button id="btn_digit_8" class="btn calc-primary-light">8</button>
          </td>
          <td>
            <button id="btn_digit_9" class="btn calc-primary-light">9</button>
          </td>
          <td>
            <button id="btn_operator_*" class="btn calc-secondary-light">*</button>
          </td>
        </tr>
        <tr>
          <td>
            <button id="btnPow2" class="btn calc-secondary-light">x²</button>
          </td>
          <td>
            <button id="btn_digit_4" class="btn calc-primary-light">4</button>
          </td>
          <td>
            <button id="btn_digit_5" class="btn calc-primary-light">5</button>
          </td>
          <td>
            <button id="btn_digit_6" class="btn calc-primary-light">6</button>
          </td>
          <td>
            <button id="btn_operator_-" class="btn calc-secondary-light">-</button>
          </td>
        </tr>
        <tr>
          <td>
            <button id="btnFact" class="btn calc-secondary-light">x!</button>
          </td>
          <td>
            <button id="btn_digit_1" class="btn calc-primary-light">1</button>
          </td>
          <td>
            <button id="btn_digit_2" class="btn calc-primary-light">2</button>
          </td>
          <td>
            <button id="btn_digit_3" class="btn calc-primary-light">3</button>
          </td>
          <td>
            <button id="btn_operator_+" class="btn calc-secondary-light">+</button>
          </td>
        </tr>
        <tr>
          <td>
            <button id="btn_digit_000" class="btn calc-primary-light">000</button>
          </td>
          <td>
            <button id="btn_digit_0" class="btn calc-primary-light">0</button>
          </td>
          <td><button id="btnDot" class="btn calc-primary-light">.</button></td>
          <td colspan="2">
            <button id="btnCalc" class="btn calc-secondary-light">=</button>
          </td>
        </tr>
      </tbody>
    </table>
    <footer>
      <div class="container" style="padding-top: 28px">
        Лабораторную работу выполнил студент группы ИУ5-42Б Корегин Илья
      </div>
    </footer>
  </body>
</html>
